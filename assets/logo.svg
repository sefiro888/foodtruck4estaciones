<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y brillo -->
    <filter id="badgeShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#F5B51B" flood-opacity="0.35"/>
    </filter>
    <filter id="glowGold" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    
    <!-- Degradados -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF0A0"/>
      <stop offset="45%" stop-color="#F5B51B"/>
      <stop offset="100%" stop-color="#E97917"/>
    </linearGradient>
    <linearGradient id="bunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FCEFD2"/>
      <stop offset="40%" stop-color="#EDB75B"/>
      <stop offset="100%" stop-color="#BD741E"/>
    </linearGradient>
    <linearGradient id="sausageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F0603A"/>
      <stop offset="50%" stop-color="#C53916"/>
      <stop offset="100%" stop-color="#841E06"/>
    </linearGradient>
    <linearGradient id="mustardGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFF580"/>
      <stop offset="100%" stop-color="#F5B51B"/>
    </linearGradient>
    <radialGradient id="badgeBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2729"/>
      <stop offset="70%" stop-color="#181719"/>
      <stop offset="100%" stop-color="#0f0f10"/>
    </radialGradient>

    <!-- Trayectorias para texto curvado -->
    <!-- Texto Superior: FULL TRACK -->
    <path id="textArcTop" d="M 70,250 A 180,180 0 0,1 430,250" fill="none"/>
    <!-- Texto Inferior: 4 ESTACIONES -->
    <path id="textArcBottom" d="M 70,250 A 180,180 0 0,0 430,250" fill="none"/>
  </defs>

  <!-- Círculo Exterior con Relieve y Borde Dorado -->
  <circle cx="250" cy="250" r="236" fill="url(#badgeBg)" stroke="url(#goldGrad)" stroke-width="10" filter="url(#badgeShadow)"/>
  <circle cx="250" cy="250" r="221" fill="none" stroke="#F6E7C2" stroke-width="2.5" stroke-dasharray="8 6" opacity="0.65"/>

  <!-- Anillo Interior para el icono central -->
  <circle cx="250" cy="250" r="138" fill="#141315" stroke="#E97917" stroke-width="4"/>
  <circle cx="250" cy="250" r="130" fill="none" stroke="#F5B51B" stroke-width="1.5" opacity="0.45"/>

  <!-- Estrellas y Detalles Decorativos Laterales -->
  <g fill="#F5B51B" filter="url(#glowGold)">
    <!-- Estrella Izquierda -->
    <polygon points="58,250 63,254 70,254 65,259 67,266 60,262 53,266 55,259 50,254 57,254" transform="translate(18,-8) scale(1.3)"/>
    <!-- Estrella Derecha -->
    <polygon points="58,250 63,254 70,254 65,259 67,266 60,262 53,266 55,259 50,254 57,254" transform="translate(342,-8) scale(1.3)"/>
  </g>

  <!-- TEXTO SUPERIOR: FULL TRACK -->
  <text fill="#FFF9EC" font-family="'Impact', 'Bebas Neue', 'Arial Black', sans-serif" font-size="52" font-weight="900" letter-spacing="6" filter="url(#badgeShadow)">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      FULL TRACK
    </textPath>
  </text>

  <!-- TEXTO INFERIOR: 4 ESTACIONES -->
  <text fill="url(#goldGrad)" font-family="'Impact', 'Bebas Neue', 'Arial Black', sans-serif" font-size="44" font-weight="900" letter-spacing="5" filter="url(#badgeShadow)">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      4 ESTACIONES
    </textPath>
  </text>

  <!-- ILUSTRACIÓN CENTRAL: STREET FOOD / PERRITO CALIENTE ARTESANAL -->
  <g transform="translate(250, 246) scale(0.95)" filter="url(#badgeShadow)">
    <!-- Pan Inferior -->
    <ellipse cx="0" cy="18" rx="98" ry="40" fill="url(#bunGrad)" stroke="#704526" stroke-width="3.5"/>
    <ellipse cx="0" cy="12" rx="88" ry="30" fill="#E2A645" opacity="0.3"/>

    <!-- Salchicha Street Food Asada -->
    <path d="M -112,-5 C -112,20 -82,36 0,36 C 82,36 112,20 112,-5 C 112,-15 102,-23 82,-23 C 0,-23 -82,-23 -112,-5 Z" fill="url(#sausageGrad)" stroke="#701A07" stroke-width="3"/>
    
    <!-- Marcas de parrilla en la salchicha -->
    <path d="M -68,2 L -58,-14 M -33,9 L -23,-16 M 0,13 L 10,-17 M 33,9 L 43,-16 M 68,2 L 78,-14" stroke="#4A1005" stroke-width="4.5" stroke-linecap="round" opacity="0.8"/>
    <path d="M -66,4 L -56,-12 M -31,11 L -21,-14 M 2,15 L 12,-15 M 35,11 L 45,-14 M 70,4 L 80,-12" stroke="#FFA78B" stroke-width="2" stroke-linecap="round" opacity="0.6"/>

    <!-- Pan Superior -->
    <path d="M -95,-12 C -95,-43 -44,-56 0,-56 C 44,-56 95,-43 95,-12 C 95,0 78,9 0,9 C -78,9 -95,0 -95,-12 Z" fill="url(#bunGrad)" stroke="#704526" stroke-width="3.5"/>
    <!-- Semillas de Sésamo -->
    <ellipse cx="-45" cy="-35" rx="3.5" ry="2" fill="#FFF9EC" transform="rotate(-15 -45 -35)"/>
    <ellipse cx="-20" cy="-44" rx="3.5" ry="2" fill="#FFF9EC" transform="rotate(10 -20 -44)"/>
    <ellipse cx="15" cy="-46" rx="3.5" ry="2" fill="#FFF9EC" transform="rotate(-5 15 -46)"/>
    <ellipse cx="45" cy="-38" rx="3.5" ry="2" fill="#FFF9EC" transform="rotate(25 45 -38)"/>
    <ellipse cx="-60" cy="-22" rx="3" ry="1.8" fill="#FFF9EC" transform="rotate(-20 -60 -22)"/>
    <ellipse cx="65" cy="-24" rx="3" ry="1.8" fill="#FFF9EC" transform="rotate(15 65 -24)"/>

    <!-- Salsa Mostaza y Mayonesa / Topping Ondulado -->
    <path d="M -82,-2 C -68,-20 -53,15 -38,-6 C -23,-25 -8,17 6,-5 C 20,-23 34,15 48,-5 C 63,-20 78,9 88,-2" fill="none" stroke="url(#mustardGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" filter="url(#glowGold)"/>
    <path d="M -78,-8 C -66,-19 -50,9 -36,-10 C -20,-27 -6,11 9,-8 C 22,-25 37,9 50,-8 C 65,-19 75,5 82,-4" fill="none" stroke="#FFF9EC" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  </g>

  <!-- Tagline Cinta / Badge Inferior decorativo -->
  <g transform="translate(250, 412)">
    <rect x="-85" y="-12" width="170" height="24" rx="12" fill="#111214" stroke="#F5B51B" stroke-width="2"/>
    <text x="0" y="5" fill="#FFF9EC" font-family="'Montserrat', sans-serif" font-size="12" font-weight="800" letter-spacing="3" text-anchor="middle">SANTANDER</text>
  </g>
</svg>
